name: All Builds (Linux, macOS, Windows, Android, APK)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: 3.11.9

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Check requirements.txt
      run: |
        if [ ! -f requirements.txt ]; then
          echo "requirements.txt not found!"
          exit 1
        fi

    - name: Install Dependencies
      run: |
        sudo apt update && sudo apt install -y python3-pip build-essential mesa-utils
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install kivy pyinstaller

    - name: Build Linux Executable
      run: |
        pyinstaller --onefile main.py --name my_kivy_app

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-artifact
        path: dist/my_kivy_app
        if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Check requirements.txt
      run: |
        if [ ! -f requirements.txt ]; then
          echo "requirements.txt not found!"
          exit 1
        fi

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install kivy pyinstaller

    - name: Build macOS Executable
      run: |
        pyinstaller --onefile main.py --name my_kivy_app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-artifact
        path: dist/my_kivy_app
        if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Check requirements.txt
      run: |
        if (!(Test-Path requirements.txt)) {
          Write-Error "requirements.txt not found!"
          exit 1
        }

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install kivy kivy_deps.sdl2 kivy_deps.glew kivy_deps.gstreamer kivy_deps.angle pyinstaller

    - name: Build Windows Executable
      run: |
        pyinstaller --onefile main.py --name my_kivy_app.exe

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-artifact
        path: dist/my_kivy_app.exe
        if-no-files-found: warn

  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Check requirements.txt
      run: |
        if [ ! -f requirements.txt ]; then
          echo "requirements.txt not found!"
          exit 1
        fi

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install kivy buildozer cython

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'  # تغيير إصدار Java إلى 17

    - name: Verify Java Installation
      run: |
        java -version
        echo "JAVA_HOME is set to: $JAVA_HOME"

    - name: Install Android SDK & NDK
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip
        mkdir -p ~/.buildozer/android/platform
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools ~/.buildozer/android/platform/android-sdk/latest
        yes | ~/.buildozer/android/platform/android-sdk/latest/bin/sdkmanager --licenses
        ~/.buildozer/android/platform/android-sdk/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;21.3.6528147"

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 7.5

    - name: Clean Buildozer Project
      run: |
        buildozer android clean

    - name: Build Android APK with Retry
      run: |
        for i in {1..3}; do
          echo "Attempt $i of 3"
          buildozer -v android debug && break
          if [ $i -eq 3 ]; then
            echo "Failed after 3 attempts"
            exit 1
          fi
          sleep 10
        done
      continue-on-error: false

    - name: Run Tests
      run: |
        cd .buildozer/android/platform/build-*/dists/*/
        ./gradlew test --stacktrace
      continue-on-error: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-build-artifact
        path: bin/*.apk
        if-no-files-found: warn
